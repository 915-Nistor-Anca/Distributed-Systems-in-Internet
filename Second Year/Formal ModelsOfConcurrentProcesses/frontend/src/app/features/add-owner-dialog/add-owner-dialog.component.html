<div class="add-owner">
    <h3>Add owner</h3>

    <form [formGroup]="ownerForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" required />
            <mat-error *ngIf="ownerForm.get('name')?.hasError('required')">
                Name is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Phone number</mat-label>
            <input matInput formControlName="phoneNumber" required />
            <mat-error *ngIf="ownerForm.get('phoneNumber')?.hasError('required')">
                Phone number is required
            </mat-error>
        </mat-form-field>

        <button type="submit" mat-raised-button color="primary">
            Add Owner
        </button>

        <div *ngIf="formSubmitted && ownerForm.invalid" class="error-message">
            All the fields are required.
        </div>

    </form>
</div>
