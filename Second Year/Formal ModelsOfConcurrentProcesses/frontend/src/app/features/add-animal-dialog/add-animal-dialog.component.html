<div class="add-animal">
  <h3>Add animal</h3>
  <form [formGroup]="animalForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="animalForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Species</mat-label>
      <mat-select formControlName="species" required [compareWith]="compareById">
        <mat-option *ngFor="let species of (speciesResult$ | async)?.items" [value]="species">
          {{ species.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="animalForm.get('species')?.hasError('required')">
        Species is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Gender</mat-label>
      <input matInput formControlName="gender" required />
      <mat-error *ngIf="animalForm.get('gender')?.hasError('required')">
        Gender is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Birth Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="birthDate" required />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="animalForm.get('birthDate')?.hasError('required')">
        Birth Date is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Owner</mat-label>
      <mat-select formControlName="owner" required [compareWith]="compareById">
        <mat-option *ngFor="let owner of (ownerResult$ | async)?.items" [value]="owner">
          {{ owner.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="animalForm.get('owner')?.hasError('required')">
        Owner is required
      </mat-error>
    </mat-form-field>

    <button type="submit" mat-raised-button color="primary">Add Animal</button>

    <div *ngIf="formSubmitted && animalForm.invalid" class="error-message">
      All the fields are required.
    </div>
  </form>
</div>
